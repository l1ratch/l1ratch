name: Generate Contribution Snake

on:
  schedule:
    # Runs every Monday at midnight UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: l1ratch
          # Generates both dark and light variants
          # color_snake sets the snake color to match your cyan/teal accent
          outputs: |
            assets/github-snake.svg?palette=github-dark&color_snake=#00F7FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: refresh contribution snake [skip ci]"
          add: "assets/github-snake.svg"
